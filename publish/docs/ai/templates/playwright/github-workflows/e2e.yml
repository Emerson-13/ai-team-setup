# Copy to .github/workflows/e2e.yml. Runs Playwright against a real MySQL service. Never SQLite.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci

      - name: Create .env.e2e
        run: |
          cp docs/ai/templates/playwright/.env.e2e.example .env.e2e
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env.e2e
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env.e2e

      - name: Build assets with e2e env (embeds VITE_REVERB_* values)
        run: npm run build:e2e

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
